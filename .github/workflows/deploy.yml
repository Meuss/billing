name: Test & deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PHP_VERSION: '8.5'
  PHP_EXTENSIONS: mbstring, intl, pdo_mysql, gd, zip, dom, fileinfo

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The suite runs against MySQL (phpunit.xml: 127.0.0.1, root, no password, billing_testing).
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: billing_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      # Filament pages load the Vite theme, so the manifest must exist for the tests.
      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      # CLI PHP on Infomaniak is picked by path; the site's web PHP is set in the Manager.
      REMOTE_PHP: /opt/php8.5/bin/php
      SITE_PATH: ${{ secrets.INFOMANIAK_SITE_PATH }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # vendor/ (its post-autoload-dump also publishes the Filament assets) and public/build.
      - name: Build release
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          npm ci
          npm run build

      # rsync --delete below: refuse to run against anything but an Infomaniak site folder
      # (guards against an empty or mistyped secret).
      - name: Check deploy target
        run: |
          case "$SITE_PATH" in
            /home/clients/*/sites/?*) ;;
            *) echo "::error::INFOMANIAK_SITE_PATH is not an Infomaniak site folder"; exit 1 ;;
          esac
          [ -n "${{ secrets.INFOMANIAK_SSH_HOST }}" ] && [ -n "${{ secrets.INFOMANIAK_SSH_USER }}" ] \
            || { echo "::error::INFOMANIAK_SSH_HOST / INFOMANIAK_SSH_USER not set"; exit 1; }

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.INFOMANIAK_SSH_KEY }}" > ~/.ssh/deploy_key
          echo "${{ secrets.INFOMANIAK_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          printf 'Host infomaniak\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' \
            "${{ secrets.INFOMANIAK_SSH_HOST }}" "${{ secrets.INFOMANIAK_SSH_USER }}" > ~/.ssh/config

      - name: Enter maintenance mode
        run: ssh infomaniak "cd '$SITE_PATH' && if [ -f artisan ]; then $REMOTE_PHP artisan down --retry=15 || true; fi"

      # Server-owned state is never touched: .env, storage/ (invoice PDFs, receipts, sessions, logs,
      # font cache) and Infomaniak's own files (.user.ini, maintenance page).
      - name: Upload code
        run: |
          rsync -az --delete \
            --exclude='/.git/' --exclude='/.github/' --exclude='/.claude/' --exclude='/.superpowers/' \
            --exclude='/.env' --exclude='/storage/' \
            --exclude='/node_modules/' --exclude='/tests/' --exclude='/public/hot' \
            --exclude='/.user.ini' --exclude='/public/.infomaniak-maintenance.html' \
            ./ "infomaniak:$SITE_PATH/"

      - name: Migrate, cache and go live
        run: |
          ssh infomaniak "set -e
            cd '$SITE_PATH'
            mkdir -p storage/app/private storage/app/public storage/fonts \
                     storage/framework/cache/data storage/framework/sessions storage/framework/views \
                     storage/logs bootstrap/cache
            $REMOTE_PHP artisan migrate --force
            $REMOTE_PHP artisan optimize
            $REMOTE_PHP artisan filament:optimize
            $REMOTE_PHP artisan up"
